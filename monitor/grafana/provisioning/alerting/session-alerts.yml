apiVersion: 1

groups:
  - name: eudiplo-session-alerts
    orgId: 1
    folder: alerting
    interval: 5m
    rules:
      - uid: high-session-error-rate
        title: High Session Error Rate
        condition: C
        data:
          # Share of failed sessions among finished ones per tenant. Every
          # replica reports the same database-derived `sessions` gauge, so
          # each series is deduplicated with max before summing.
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                sum by (tenant_id) (max by (tenant_id, session_type, status) (sessions{status="failed"}))
                / sum by (tenant_id) (max by (tenant_id, session_type, status) (sessions{status=~"completed|failed"}))
              instant: true
              interval: ''
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.1
                    type: gt
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          description: 'Session failure rate is {{ humanizePercentage $values.B.Value }} for tenant {{ $labels.tenant_id }}'
          summary: High session error rate detected
        labels:
          severity: warning
          team: eudiplo
