apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Full Overlay
# Use case: Evaluating the encryption key in Vault. The bundled Vault runs in
#           development mode and keeps everything in memory.
# Components: EUDIPLO + PostgreSQL + RustFS + HashiCorp Vault (development mode)

resources:
  - ../../base

namespace: eudiplo

components:
  - ../../components/postgres
  - ../../components/rustfs
  - ../../components/vault
