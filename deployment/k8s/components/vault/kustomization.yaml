apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# HashiCorp Vault Component
# Adds Vault for secure key management

resources:
  - vault-deployment.yaml
  - vault-service.yaml
  - vault-bootstrap-job.yaml

# Patch EUDIPLO deployment to use Vault for key management
patches:
  - target:
      kind: Deployment
      name: eudiplo
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/-
        value:
          name: wait-for-vault
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eudiplo-env
                  key: VAULT_TOKEN
          command:
            - sh
            - -c
            - |
              until wget -qO- --header="X-Vault-Token: $VAULT_TOKEN" http://vault:8200/v1/secret/data/eudiplo/encryption-key >/dev/null 2>&1; do
                echo "waiting for Vault encryption key..."; sleep 3;
              done
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: VAULT_ADDR
          value: "http://vault:8200"
