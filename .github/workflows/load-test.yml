name: Load Tests

on:
  # Manual trigger — choose a specific scenario and profile
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to run (or "all")
        required: false
        default: all
        type: choice
        options:
          - all
          - api-auth
          - pre-auth-issuance
          - oid4vp-presentation
          - status-list
      profile:
        description: Load profile
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike

  # Scheduled weekly regression — run the full suite with the smoke profile
  # every Monday at 02:00 UTC.
  schedule:
    - cron: '0 2 * * 1'

permissions: {}

# Docker Hub login is optional: without the secrets, jobs pull anonymously.
env:
  HAS_DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

concurrency:
  group: load-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    name: k6 Load Test (${{ inputs.scenario || 'all' }} / ${{ inputs.profile || 'smoke' }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      BASE_URL: http://localhost:3000
      TENANT_ID: demo
      CLIENT_ID: test-client
      CLIENT_SECRET: test-client-secret
      K6_ENV_FILE: ${{ github.workspace }}/deployment/docker-compose/k6.env

    steps:
      # -------------------------------------------------------------------
      # Checkout & toolchain
      # -------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Authenticated pulls avoid Docker Hub's anonymous rate limit. Skipped
      # where the secrets are unavailable (forks, Dependabot).
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------------------
      # Install k6
      # -------------------------------------------------------------------
      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      # -------------------------------------------------------------------
      # Build the backend under test
      # -------------------------------------------------------------------
      - name: Build backend image
        run: docker build --target eudiplo --tag eudiplo:load-test .

      - name: Run k6 load tests
        env:
          EUDIPLO_IMAGE: eudiplo:load-test
          K6_PROFILE: ${{ inputs.profile || 'smoke' }}
        run: |
          scenario="${{ inputs.scenario || 'all' }}"
          args=()
          if [[ "${scenario}" != "all" ]]; then
            args+=("${scenario}")
          fi

          bash scripts/load-test/run-all.sh "${args[@]}"

      - name: Capture stack logs on failure
        if: failure()
        run: |
          mkdir -p scripts/load-test/results
          docker compose \
            --env-file "${K6_ENV_FILE}" \
            --profile standard \
            --project-directory deployment/docker-compose \
            logs --no-color > scripts/load-test/results/compose.log 2>&1 || true

      # -------------------------------------------------------------------
      # Upload results regardless of pass/fail
      # -------------------------------------------------------------------
      - name: Upload test summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-results-${{ github.run_id }}
          path: scripts/load-test/results/
          retention-days: 30

      # -------------------------------------------------------------------
      # Stop the test stack and remove its persistent data
      # -------------------------------------------------------------------
      - name: Stop test stack
        if: always()
        run: |
          docker compose \
            --env-file "${K6_ENV_FILE}" \
            --profile standard \
            --project-directory deployment/docker-compose \
            down --volumes --remove-orphans
