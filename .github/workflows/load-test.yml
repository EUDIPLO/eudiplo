name: Load Tests

on:
  # Manual trigger — choose a specific scenario and profile
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to run (or "all")
        required: false
        default: all
        type: choice
        options:
          - all
          - mixed
          - api-auth
          - pre-auth-issuance
          - oid4vp-presentation
          - status-list
      profile:
        description: Load profile
        required: false
        default: smoke
        type: choice
        options:
          - once
          - smoke
          - load
          - stress
          - spike
      seed_sessions:
        description: Sessions to create before measuring (0 = none)
        required: false
        default: '0'
        type: string

  # Changes to the suite itself are validated against a freshly built backend.
  pull_request:
    paths:
      - scripts/load-test/**
      - deployment/docker-compose/**
      - .github/workflows/load-test.yml

  # Scheduled regressions (UTC):
  #   Monday 02:00     all scenarios, smoke profile
  #   Wednesday 02:00  mixed workload, load profile, 20 000 pre-seeded sessions
  schedule:
    - cron: '0 2 * * 1'
    - cron: '0 2 * * 3'

permissions: {}

# Docker Hub login is optional: without the secrets, jobs pull anonymously.
env:
  HAS_DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

concurrency:
  group: load-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    name: k6 Load Test (${{ inputs.scenario || (github.event.schedule == '0 2 * * 3' && 'mixed') || 'all' }} / ${{ inputs.profile || (github.event.schedule == '0 2 * * 3' && 'load') || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    env:
      BASE_URL: http://localhost:3000
      TENANT_ID: demo
      CLIENT_ID: test-client
      CLIENT_SECRET: test-client-secret
      K6_ENV_FILE: ${{ github.workspace }}/deployment/docker-compose/k6.env
      # The weekly load run measures the production-like mixed workload on a
      # database that already holds sessions; everything else runs smoke.
      SCENARIO: ${{ inputs.scenario || (github.event.schedule == '0 2 * * 3' && 'mixed') || 'all' }}
      K6_PROFILE: ${{ inputs.profile || (github.event.schedule == '0 2 * * 3' && 'load') || 'smoke' }}
      SEED_SESSIONS: ${{ inputs.seed_sessions || (github.event.schedule == '0 2 * * 3' && '20000') || '0' }}

    steps:
      # -------------------------------------------------------------------
      # Checkout & toolchain
      # -------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Authenticated pulls avoid Docker Hub's anonymous rate limit. Skipped
      # where the secrets are unavailable (forks, Dependabot).
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------------------
      # Unit tests of the suite (profiles, thresholds, wallet crypto,
      # summaries, baseline) — fast, and fail before the image build
      # -------------------------------------------------------------------
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Unit tests of the load-test suite
        run: node --import ./scripts/load-test/test/shims/register.mjs --test 'scripts/load-test/test/*.test.mjs'

      # -------------------------------------------------------------------
      # Install k6
      # -------------------------------------------------------------------
      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      # -------------------------------------------------------------------
      # Build the backend under test
      # -------------------------------------------------------------------
      - name: Build backend image
        run: docker build --target eudiplo --tag eudiplo:load-test .

      - name: Run k6 load tests
        env:
          EUDIPLO_IMAGE: eudiplo:load-test
        run: |
          args=()
          if [[ "${SCENARIO}" != "all" ]]; then
            args+=("${SCENARIO}")
          fi

          bash scripts/load-test/run-all.sh "${args[@]}"

      # Always keep the backend logs: a passing run can still log errors
      # (retries, warnings) that explain a latency change.
      - name: Capture stack logs
        if: always()
        run: |
          mkdir -p scripts/load-test/results
          docker compose \
            --env-file "${K6_ENV_FILE}" \
            --profile standard \
            --project-directory deployment/docker-compose \
            logs --no-color > scripts/load-test/results/compose.log 2>&1 || true

      # -------------------------------------------------------------------
      # Upload results regardless of pass/fail
      # -------------------------------------------------------------------
      - name: Upload test summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-results-${{ github.run_id }}
          path: scripts/load-test/results/
          retention-days: 30

      # -------------------------------------------------------------------
      # Stop the test stack and remove its persistent data
      # -------------------------------------------------------------------
      - name: Stop test stack
        if: always()
        run: |
          docker compose \
            --env-file "${K6_ENV_FILE}" \
            --profile standard \
            --project-directory deployment/docker-compose \
            down --volumes --remove-orphans
