name: Versioned Release

on:
  workflow_dispatch:
    inputs:
      confirm_major:
        description: 'Type CONFIRM to allow a major version bump'
        required: false
        type: string
        default: ''
      deploy_site_only:
        description: 'Deploy the website and docs of main to production without a release (fails if a release is pending)'
        required: false
        type: boolean
        default: false

  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'versioned-release' || 'npm-prerelease-main' }}
  cancel-in-progress: false

jobs:
  # =============================================================================
  # NPM Pre-release (successful main-branch CI runs only)
  # Publishes @eudiplo/sdk-core and @eudiplo/cli with the "main" dist-tag.
  # =============================================================================
  npm-prerelease:
    name: Publish npm Pre-release
    if: >-
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Wait for successful CI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: 'push',
                head_sha: context.sha,
                per_page: 100,
              });
              const ciRun = response.data.workflow_runs.find(
                (run) => run.name === 'CI / Docker' && run.id !== context.runId
              );

              if (ciRun?.conclusion === 'success') {
                core.info(`Using successful CI run ${ciRun.html_url}`);
                return;
              }

              if (ciRun?.conclusion && ciRun.conclusion !== 'success') {
                core.setFailed(`CI / Docker did not succeed: ${ciRun.conclusion}`);
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            core.setFailed(`Timed out waiting for CI / Docker for ${context.sha}.`);

      - name: Checkout CI commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @eudiplo/sdk-core build

      - name: Build config format
        run: pnpm --filter @eudiplo/config-format build

      - name: Build CLI
        run: pnpm --filter @eudiplo/cli build

      - name: Set pre-release version
        working-directory: packages/eudiplo-sdk-core
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Same version string as the main Docker images (e.g. 5.1.0-main.abc1234).
          PRE_VERSION=$(../../scripts/ci-version.sh "$SOURCE_SHA")
          echo "Publishing version: ${PRE_VERSION}"
          npm version "${PRE_VERSION}" --no-git-tag-version
          node ../../apps/cli/scripts/sync-cli-version.cjs "${PRE_VERSION}"

      - name: Publish SDK to npm with main tag
        working-directory: packages/eudiplo-sdk-core
        run: npm publish --tag main --access public --provenance

      - name: Publish CLI to npm with main tag
        run: node apps/cli/scripts/publish-cli.cjs main

  prepare-release:
    name: Prepare versioned release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    outputs:
      has_release: ${{ steps.version_check.outputs.has_release }}
      is_major: ${{ steps.version_check.outputs.is_major }}
      next_version: ${{ steps.version_check.outputs.next_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Versioned releases must be dispatched from the main branch."
          exit 1

      - name: Verify successful CI for this commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: 'push',
              status: 'completed',
              per_page: 100,
            });

            const successfulRun = response.data.workflow_runs.find(
              (run) =>
                run.name === 'CI / Docker' &&
                run.head_sha === context.sha &&
                run.conclusion === 'success'
            );

            if (!successfulRun) {
              core.setFailed(`No successful CI / Docker push run exists for ${context.sha}.`);
              return;
            }

            core.info(`Releasing artifacts from ${successfulRun.html_url}`);

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for major version bump
        id: version_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running semantic-release dry-run to detect version bump..."
          DRY_EXIT=0
          DRY_OUTPUT="$(npx semantic-release --dry-run 2>&1)" || DRY_EXIT=$?
          echo "$DRY_OUTPUT"
          if [ "$DRY_EXIT" -ne 0 ]; then
            echo "semantic-release dry-run failed (see output above)" >&2
            exit "$DRY_EXIT"
          fi

          NEXT_VERSION=$(echo "$DRY_OUTPUT" | grep -oP "The next release version is \K[0-9]+\.[0-9]+\.[0-9]+" || echo "")
          CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")

          echo "Current version: $CURRENT_VERSION"
          echo "Next version: $NEXT_VERSION"

          if [ -z "$NEXT_VERSION" ]; then
            echo "No release will be created"
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            echo "is_major=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_release=true" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

          CURRENT_MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          NEXT_MAJOR=$(echo "$NEXT_VERSION" | cut -d. -f1)

          if [ "$NEXT_MAJOR" -gt "$CURRENT_MAJOR" ]; then
            echo "⚠️  MAJOR VERSION BUMP DETECTED: $CURRENT_VERSION → $NEXT_VERSION"
            echo "is_major=true" >> "$GITHUB_OUTPUT"
          else
            echo "Minor/patch release: $CURRENT_VERSION → $NEXT_VERSION"
            echo "is_major=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abort when no release is pending
        if: steps.version_check.outputs.has_release != 'true' && !inputs.deploy_site_only
        run: |
          echo "No releasable commits were found since the latest version."
          echo "To deploy documentation-only changes, run this workflow with deploy_site_only."
          exit 1

      - name: Abort a site-only deploy when a release is pending
        if: steps.version_check.outputs.has_release == 'true' && inputs.deploy_site_only
        run: |
          echo "main contains releasable commits, so its documentation may describe unreleased behavior."
          echo "Run this workflow without deploy_site_only to release; the release deploys the website and docs."
          exit 1

      - name: Abort if major release not confirmed
        if: steps.version_check.outputs.is_major == 'true' && github.event.inputs.confirm_major != 'CONFIRM'
        run: |
          echo "❌ MAJOR VERSION RELEASE BLOCKED"
          echo ""
          echo "A major version bump was detected but not confirmed."
          echo "To release a major version, trigger this workflow manually with:"
          echo "  confirm_major: CONFIRM"
          exit 1

  build-cli-release:
    name: Build CLI (${{ matrix.target }})
    needs: prepare-release
    if: needs.prepare-release.outputs.has_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: macos-arm64
          - runner: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync CLI version
        shell: bash
        run: node apps/cli/scripts/sync-cli-version.cjs "${{ needs.prepare-release.outputs.next_version }}"

      - name: Install dependencies
        run: pnpm --filter @eudiplo/cli... install --frozen-lockfile

      - name: Build config format
        run: pnpm --filter @eudiplo/config-format build

      - name: Build CLI
        shell: bash
        run: pnpm --filter @eudiplo/cli build

      - name: Build standalone CLI SEA
        shell: bash
        run: pnpm --filter @eudiplo/cli build:sea

      - name: Smoke test executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./apps/cli/dist-sea/eudiplo.exe --help
          else
            ./apps/cli/dist-sea/eudiplo --help
          fi

      - name: Package binary
        shell: bash
        run: |
          set -e
          mkdir -p release
          ARCHIVE_NAME="eudiplo-v${{ needs.prepare-release.outputs.next_version }}-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == "windows-x64" ]]; then
            powershell -NoProfile -ExecutionPolicy Bypass -Command "Compress-Archive -Path 'apps/cli/dist-sea/eudiplo.exe' -DestinationPath 'release/${ARCHIVE_NAME}.zip' -Force"
          else
            chmod +x apps/cli/dist-sea/eudiplo
            tar -C apps/cli/dist-sea -czf "release/${ARCHIVE_NAME}.tar.gz" eudiplo
          fi

      - name: Upload packaged CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-cli-release]
    if: needs.prepare-release.outputs.has_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download packaged CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -e
          mkdir -p release
          find release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
          echo "Generated checksums:"
          cat release/SHA256SUMS.txt

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config format
        run: pnpm --filter @eudiplo/config-format build

      - name: Set release version
        id: release_version
        run: |
          echo "version=${{ needs.prepare-release.outputs.next_version }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable Docker source images
        run: |
          docker buildx imagetools inspect "ghcr.io/eudiplo/eudiplo:sha-${GITHUB_SHA}"
          docker buildx imagetools inspect "ghcr.io/eudiplo/eudiplo-client:sha-${GITHUB_SHA}"
          docker buildx imagetools inspect "ghcr.io/eudiplo/eudiplo-demo:sha-${GITHUB_SHA}"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare-release.outputs.next_version }}"

          test -s "release/eudiplo-v${VERSION}-linux-x64.tar.gz"
          test -s "release/eudiplo-v${VERSION}-linux-arm64.tar.gz"
          test -s "release/eudiplo-v${VERSION}-macos-arm64.tar.gz"
          test -s "release/eudiplo-v${VERSION}-windows-x64.zip"
          test -s "release/SHA256SUMS.txt"

      - name: Attest release artifacts
        id: attest_release
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release/*'

      - name: Include attestation bundle in release assets
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_release.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" release/provenance.sigstore.json

      - name: Run semantic-release
        id: semantic_release
        env:
          EUDIPLO_RELEASE_VERSION: ${{ needs.prepare-release.outputs.next_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          DOCKER_REGISTRY_USER: ${{ github.actor }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_SOURCE_SHA: ${{ github.sha }}
        run: |
          echo "Running semantic-release with release assets ready..."
          npx semantic-release

          NEXT_VERSION="${{ needs.prepare-release.outputs.next_version }}"
          EXPECTED_TAG="v${NEXT_VERSION}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${EXPECTED_TAG}" >/dev/null; then
            echo "semantic-release did not publish the expected tag ${EXPECTED_TAG}"
            exit 1
          fi

          echo "new_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${EXPECTED_TAG}" >> "$GITHUB_OUTPUT"

  # Production deploy of the website and documentation: after a published
  # release, or for deploy_site_only. prepare-release only lets the latter pass
  # when no release is pending, so main differs from the latest release only by
  # commits that need none (docs, test, chore, ci, build) and its documentation
  # matches the released code.
  deploy-site:
    name: Deploy Website & Documentation
    needs: [prepare-release, publish-release]
    if: >-
      !cancelled() &&
      needs.prepare-release.result == 'success' &&
      (needs.publish-release.result == 'success' || inputs.deploy_site_only)
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment: production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
      ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
      ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
      DOCSEARCH_AGENT_ID: ${{ secrets.DOCSEARCH_AGENT_ID }}
