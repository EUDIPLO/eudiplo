name: Deploy Website & Documentation

# Builds the website and the documentation of the calling commit and deploys
# both to Cloudflare Pages. CI / Docker calls it with `preview` for every push
# to main, Versioned Release with `production`.
on:
  workflow_call:
    inputs:
      environment:
        description: 'Cloudflare Pages branch: preview or production'
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      ALGOLIA_APP_ID:
        required: true
      ALGOLIA_SEARCH_API_KEY:
        required: true
      ALGOLIA_INDEX_NAME:
        required: true
      DOCSEARCH_AGENT_ID:
        required: true

permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_PAGES_BRANCH: ${{ inputs.environment }}
    steps:
      - name: Check deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
          DOCSEARCH_AGENT_ID: ${{ secrets.DOCSEARCH_AGENT_ID }}
        run: |
          case "$CLOUDFLARE_PAGES_BRANCH" in
            preview|production) ;;
            *) echo "Unknown environment '$CLOUDFLARE_PAGES_BRANCH' (expected preview or production)"; exit 1 ;;
          esac
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ALGOLIA_APP_ID ALGOLIA_SEARCH_API_KEY ALGOLIA_INDEX_NAME DOCSEARCH_AGENT_ID; do
            test -n "${!var}" || { echo "$var is not configured"; exit 1; }
          done

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config format
        run: pnpm --filter @eudiplo/config-format build

      - name: Build documentation
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
          DOCSEARCH_AGENT_ID: ${{ secrets.DOCSEARCH_AGENT_ID }}
        run: pnpm --filter @eudiplo/docs run build

      - name: Check installer script
        run: |
          test -s apps/website/install.sh
          bash -n apps/website/install.sh

      - name: Deploy website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @eudiplo/website run deploy

      - name: Deploy documentation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @eudiplo/docs run pages:deploy
