name: Deploy Website & Documentation

# Builds the documentation of the calling commit and deploys it to Cloudflare
# Pages, then asks EUDIPLO/website to deploy eudiplo.dev to the same
# environment with the schemas and CLI installer of the calling commit.
# CI / Docker calls it with `preview` for every push to main, Versioned Release
# with `production`.
on:
  workflow_call:
    inputs:
      environment:
        description: 'Cloudflare Pages branch: preview or production'
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      ALGOLIA_APP_ID:
        required: true
      ALGOLIA_SEARCH_API_KEY:
        required: true
      ALGOLIA_INDEX_NAME:
        required: true
      DOCSEARCH_AGENT_ID:
        required: true
      WEBSITE_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_PAGES_BRANCH: ${{ inputs.environment }}
    steps:
      - name: Check deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
          DOCSEARCH_AGENT_ID: ${{ secrets.DOCSEARCH_AGENT_ID }}
        run: |
          case "$CLOUDFLARE_PAGES_BRANCH" in
            preview|production) ;;
            *) echo "Unknown environment '$CLOUDFLARE_PAGES_BRANCH' (expected preview or production)"; exit 1 ;;
          esac
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ALGOLIA_APP_ID ALGOLIA_SEARCH_API_KEY ALGOLIA_INDEX_NAME DOCSEARCH_AGENT_ID; do
            test -n "${!var}" || { echo "$var is not configured"; exit 1; }
          done

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config format
        run: pnpm --filter @eudiplo/config-format build

      - name: Build documentation
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
          DOCSEARCH_AGENT_ID: ${{ secrets.DOCSEARCH_AGENT_ID }}
        run: pnpm --filter @eudiplo/docs run build

      - name: Deploy documentation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @eudiplo/docs run pages:deploy

  # eudiplo.dev is built in EUDIPLO/website, which checks out this commit for
  # the schemas. A job of its own: the dispatch token never shares a runner
  # with pnpm install or the documentation build.
  deploy-website:
    name: Deploy website to ${{ inputs.environment }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    # WEBSITE_APP_PRIVATE_KEY is a secret of this environment, which only main
    # may deploy to, so runs of other branches cannot read the key.
    environment: website-deploy
    steps:
      # Short-lived token of the org-owned GitHub App "eudiplo-website-deploy",
      # installed on EUDIPLO/website only, limited to contents:write (needed
      # for repository dispatch events).
      - name: Create website token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liw543awIYomOJRs
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: EUDIPLO
          repositories: website
          permission-contents: write

      - name: Deploy website
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          EVENT_TYPE: eudiplo-${{ inputs.environment }}
          EUDIPLO_REF: ${{ github.sha }}
        run: |
          gh api --method POST repos/EUDIPLO/website/dispatches \
            -f event_type="$EVENT_TYPE" \
            -f "client_payload[ref]=$EUDIPLO_REF"
