name: CI / Docker

on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-schemas:
    name: Check Config Schemas and Website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install dependencies for contract generation
        run: pnpm install --frozen-lockfile
      - name: Check current DTOs against published config contracts
        run: pnpm schemas:check-contract
      - name: Check shared config implementation and bundled snapshots
        run: node scripts/sync-config-format.mjs --check
      - name: Prevent changes to existing published schema versions
        env:
          SCHEMA_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD' }}
        run: |
          if [ "$SCHEMA_BASE_REVISION" = "0000000000000000000000000000000000000000" ]; then SCHEMA_BASE_REVISION=HEAD; fi
          node scripts/check-published-schemas.mjs "$SCHEMA_BASE_REVISION"
      - name: Build website and verify published schema references
        run: node scripts/build-website.mjs

  lint:
    permissions:
      contents: read
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter for code
        run: pnpm run lint

      - name: Check .env.example covers required config
        run: pnpm run check:env-example

      - name: Run linter for documentation
        run: pnpm --filter @eudiplo/docs run lint

      - name: Run license check (backend, production)
        working-directory: apps/backend
        run: pnpm dlx license-checker --production --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;ISC;OFL-1.1"

      - name: Run license check (client, production)
        working-directory: apps/client
        run: pnpm dlx license-checker --production --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;ISC;OFL-1.1"

      - name: Run knip
        run: pnpm knip --no-progress

  build-sdk-core:
    name: Build SDK Core
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK Core
        run: pnpm --filter @eudiplo/sdk-core build

  build-cli:
    name: Build CLI
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config format
        run: pnpm --filter @eudiplo/config-format build

      - name: Build CLI
        run: pnpm --filter @eudiplo/cli build

      - name: Run CLI tests
        run: pnpm --filter @eudiplo/cli test

      - name: Build CLI SEA
        run: pnpm --filter @eudiplo/cli build:sea

      - name: Smoke test standalone CLI
        run: ./apps/cli/dist-sea/eudiplo --help

      - name: Build CLI npm bundle
        run: pnpm --filter @eudiplo/cli build:publish

      - name: Pack CLI as it would be published to npm
        working-directory: apps/cli
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - name: Smoke test packed CLI outside the workspace
        # Extracts the exact tarball npm would publish and runs it from
        # outside the repo/pnpm workspace so relative template asset paths
        # can't accidentally resolve against files that only exist locally.
        run: |
          set -euo pipefail
          extract_dir="$RUNNER_TEMP/cli-pack-test"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$RUNNER_TEMP"/eudiplo-cli-*.tgz -C "$extract_dir"
          cd "$extract_dir/package"
          node dist/index.js --help
          init_dir="$RUNNER_TEMP/cli-init-test"
          rm -rf "$init_dir"
          node dist/index.js init "$init_dir" --target compose --no-interactive --yes --demo-tenant --demo --no-client
          node dist/index.js config validate tenant "$init_dir/config/demo"

  build-backend:
    name: Build Backend
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config format
        run: pnpm --filter @eudiplo/config-format build

      - name: Build backend
        run: pnpm --filter @eudiplo/backend build

  build-client:
    name: Build Client
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sdk core
        run: pnpm --filter @eudiplo/sdk-core build

      - name: Build client
        run: pnpm --filter @eudiplo/client build

      - name: Run client unit tests
        run: pnpm --filter @eudiplo/client test --watch=false

  build-webhook:
    name: Build Webhook
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build webhook
        run: pnpm --filter test-rp build

  build-doc:
    name: Build Documentation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config format
        run: pnpm --filter @eudiplo/config-format build

      - name: Test request documentation
        run: pnpm --filter @eudiplo/docs test

      - name: Typecheck request documentation scripts
        run: pnpm --filter @eudiplo/docs typecheck:scripts

      - name: Build documentation
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
          DOCSEARCH_AGENT_ID: ${{ secrets.DOCSEARCH_AGENT_ID }}
        run: pnpm --filter @eudiplo/docs run build

      - name: Upload built documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-docs
          path: apps/docs/build/

  deploy-docs:
    name: Deploy Preview Website & Documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-doc]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config format
        run: pnpm --filter @eudiplo/config-format build

      - name: Build generated docs content
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
          DOCSEARCH_AGENT_ID: ${{ secrets.DOCSEARCH_AGENT_ID }}
        run: pnpm --filter @eudiplo/docs run build

      - name: Deploy website to Cloudflare Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_BRANCH: preview
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          pnpm --filter @eudiplo/website run deploy

      - name: Deploy documentation to Cloudflare Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_BRANCH: preview
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          pnpm --filter @eudiplo/docs run pages:deploy

  test-e2e:
    permissions:
      contents: read
    name: E2E Tests (non-OIDF)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add entry to /etc/hosts
        run: echo "127.0.0.1       host.testcontainers.internal" | sudo tee -a /etc/hosts

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config format
        run: pnpm --filter @eudiplo/config-format build

      - name: setup test webhooks
        run: |
          nohup pnpm --filter test-rp dev &

      - name: Run E2E tests
        run: pnpm run --filter @eudiplo/backend test:e2e
        env:
          TESTCONTAINERS_HOST_OVERRIDE: host.testcontainers.internal

  test-e2e-oidf:
    permissions:
      contents: read
    name: E2E Tests (OIDF)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add entry to /etc/hosts
        run: echo "127.0.0.1       host.testcontainers.internal" | sudo tee -a /etc/hosts

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config format
        run: pnpm --filter @eudiplo/config-format build

      - name: setup test webhooks
        run: |
          nohup pnpm --filter test-rp dev &

      - name: Run OIDF E2E tests
        run: pnpm run --filter @eudiplo/backend test:oidf
        env:
          TESTCONTAINERS_HOST_OVERRIDE: host.testcontainers.internal

      - name: Upload OIDF test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidf-test-results
          path: tmp/oidf-logs
          if-no-files-found: ignore

  test-coverage-report:
    permissions:
      contents: read
    name: Test Coverage Report
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Add entry to /etc/hosts
        run: echo "127.0.0.1       host.testcontainers.internal" | sudo tee -a /etc/hosts

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config format
        run: pnpm --filter @eudiplo/config-format build

      - name: setup test webhooks
        run: |
          nohup pnpm --filter test-rp dev &

      - name: Run backend unit tests with coverage
        run: pnpm --filter @eudiplo/backend exec vitest run --coverage --config ./vitest.config.ts

      - name: Run backend E2E tests with coverage
        run: pnpm run --filter @eudiplo/backend test:e2e
        env:
          TESTCONTAINERS_HOST_OVERRIDE: host.testcontainers.internal

      - name: Upload Cobertura coverage artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-cobertura-coverage
          path: |
            apps/backend/coverage/unit/cobertura-coverage.xml
            apps/backend/coverage/e2e/cobertura-coverage.xml
          if-no-files-found: error

  upload-code-coverage:
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
    continue-on-error: true
    name: Upload Coverage to GitHub Code Quality
    runs-on: ubuntu-latest
    needs: [test-coverage-report]
    if: >-
      needs.test-coverage-report.result == 'success' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Download Cobertura coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-cobertura-coverage
          path: apps/backend/coverage

      - uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: apps/backend/coverage/unit/cobertura-coverage.xml
          language: TypeScript
          label: backend-unit
          fail-on-error: false

      - uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: apps/backend/coverage/e2e/cobertura-coverage.xml
          language: TypeScript
          label: backend-e2e
          fail-on-error: false

  # =============================================================================
  # Build info: one version shared by all Docker images of this run, so the
  # client can detect when it is connected to a backend from a different build.
  # =============================================================================
  build-info:
    name: Compute Build Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Compute version
        id: version
        run: echo "version=$(scripts/ci-version.sh "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  # =============================================================================
  # Docker Backend: Build, Test & Push (multi-platform with native runners)
  # Uses native ARM runners instead of QEMU for ~4x faster arm64 builds.
  # Skip arm64 on PRs to save time - only build amd64 for validation.
  # =============================================================================
  docker-backend:
    name: Build & Test Backend Docker (${{ matrix.arch }})
    needs: [build-info, test-e2e, test-e2e-oidf]
    strategy:
      fail-fast: false
      matrix:
        # Dynamic matrix: include arm64 only on main branch push
        include: '${{ fromJSON(github.event_name == ''push'' && github.ref == ''refs/heads/main'' && ''[{"platform": "linux/amd64", "runner": "ubuntu-latest", "arch": "amd64"}, {"platform": "linux/arm64", "runner": "ubuntu-24.04-arm", "arch": "arm64"}]'' || ''[{"platform": "linux/amd64", "runner": "ubuntu-latest", "arch": "amd64"}]'') }}'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/openwallet-foundation/eudiplo

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Health test (amd64 only) ---
      - name: Build Backend Docker image (for testing)
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: eudiplo
          load: true
          tags: ghcr.io/openwallet-foundation/eudiplo:test
          build-args: |
            VERSION=${{ needs.build-info.outputs.version }}
            REVISION=${{ needs.build-info.outputs.revision }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,scope=backend-${{ matrix.arch }},mode=max

      - name: Run container (detached)
        if: matrix.arch == 'amd64'
        run: |
          docker run -d \
            --name eudiplo-test \
            -p 8080:8080 \
            -e MASTER_SECRET=ci-docker-test-secret-min-32-chars \
            -e AUTH_CLIENT_ID=ci-docker-client \
            -e AUTH_CLIENT_SECRET=ci-docker-secret \
            -e ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            ghcr.io/openwallet-foundation/eudiplo:test

      - name: Wait for healthy
        if: matrix.arch == 'amd64'
        run: |
          set -e
          # Check if container is running
          if ! docker ps -q -f name=eudiplo-test | grep -q .; then
            echo "Container failed to start or exited immediately ❌"
            echo ""
            echo "=== Container Status ==="
            docker ps -a -f name=eudiplo-test
            echo ""
            echo "=== Container Logs ==="
            docker logs eudiplo-test 2>&1 || echo "No logs available"
            exit 1
          fi

          # wait up to ~90s (45 * 2s) for HEALTHCHECK to pass
          for i in $(seq 1 45); do
            # Check if container is still running
            if ! docker ps -q -f name=eudiplo-test | grep -q .; then
              echo "Container stopped unexpectedly ❌"
              echo ""
              echo "=== Container Status ==="
              docker ps -a -f name=eudiplo-test
              echo ""
              echo "=== Container Logs ==="
              docker logs eudiplo-test 2>&1 || true
              exit 1
            fi
            
            STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' eudiplo-test)
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy ✅"
              exit 0
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              echo "Container reported unhealthy ❌"
              echo ""
              echo "=== Health Check Log ==="
              docker inspect --format='{{range .State.Health.Log}}{{.Output}}{{end}}' eudiplo-test || true
              echo ""
              echo "=== Container Logs ==="
              docker logs eudiplo-test || true
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for healthy ❌"
          docker ps
          echo ""
          echo "=== Health Check Log ==="
          docker inspect --format='{{range .State.Health.Log}}{{.Output}}{{end}}' eudiplo-test || true
          echo ""
          echo "=== Container Logs ==="
          docker logs eudiplo-test || true
          exit 1

      - name: Stop test container
        if: ${{ always() && matrix.arch == 'amd64' }}
        run: docker rm -f eudiplo-test || true

      # --- Build and push by digest (main push only) ---
      - name: Build and push by digest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: eudiplo
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.build-info.outputs.version }}
            REVISION=${{ needs.build-info.outputs.revision }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/openwallet-foundation/eudiplo,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,scope=backend-${{ matrix.arch }},mode=max

      - name: Export digest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

