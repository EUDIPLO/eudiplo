name: Container image scan

# Dependabot only bumps image tags: container images are not in the GitHub
# Advisory Database, so it never reports vulnerabilities in them. This workflow
# scans the published images with Trivy and uploads the results to Code
# Scanning, next to CodeQL. It runs daily so CVEs disclosed after a build show
# up without a new image, and after every main or release build.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_run:
    workflows: ['CI / Docker', 'Versioned Release']
    types: [completed]
    branches: ['main']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan ${{ matrix.image }}:${{ matrix.tag }}
    # Only scan after a build that succeeded and ran in this repository: the
    # branches filter matches a fork PR whose branch is also named main. The
    # images are public on GHCR, so no registry login is needed.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
      )
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [eudiplo, eudiplo-client]
        # main = what the next release ships, latest = what users run today.
        tag: [main, latest]
    steps:
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ghcr.io/eudiplo/${{ matrix.image }}:${{ matrix.tag }}
          scanners: vuln
          # Report what an image rebuild or dependency bump can fix.
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          format: sarif
          output: trivy.sarif

      - name: Upload results to Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image }}-${{ matrix.tag }}
