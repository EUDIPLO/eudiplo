version: 2

updates:
  # --- JS/TS deps across the pnpm monorepo ---
  - package-ecosystem: npm
    directory: "/"                     # scans all package.json + pnpm-lock.yaml
    schedule:
      interval: weekly
      day: tuesday
      time: "05:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 8
    commit-message:
      prefix: "deps"
      include: "scope"
    versioning-strategy: increase-if-necessary
    labels: ["dependencies", "pnpm", "javascript"]

    # Ignore internal workspace packages (Dependabot doesn't support workspace: protocol)
    ignore:
      - dependency-name: "@eudiplo/*"
      # TypeScript 7.0 ships tsc only, without the compiler API that the Nest CLI,
      # tsup and typescript-eslint need. Packages that only run tsc are already on
      # 7; hold the rest on 6 until 7.1 restores the API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

    # One PR per ecosystem: everything npm lands in a single security PR
    # and a single version PR.
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-version:
        applies-to: version-updates
        patterns: ["*"]

  # --- GitHub Actions versions in .github/workflows ---
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "05:30"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    labels: ["dependencies", "github-actions"]

    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
      github-actions-version:
        applies-to: version-updates
        patterns: ["*"]

  # --- Docker base images (adjust directory if Dockerfiles live elsewhere) ---
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    labels: ["dependencies", "docker"]

    # Container images are not in the GitHub Advisory Database, so docker has
    # no security-updates stream - a version group only.
    groups:
      docker-version:
        applies-to: version-updates
        patterns: ["*"]

  # --- Images pinned in compose files (docker does not cover these) ---
  - package-ecosystem: docker-compose
    directories:
      - "/"
      - "/monitor"
      - "/deployment/docker-compose"
      - "/apps/cli/templates"
    schedule:
      interval: monthly
      time: "06:15"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    labels: ["dependencies", "docker"]

    # No security-updates stream here either, same as docker.
    groups:
      docker-compose-version:
        applies-to: version-updates
        patterns: ["*"]

    # A PostgreSQL major upgrade needs a data migration (and postgres:18 moved
    # its volume to /var/lib/postgresql), so majors are upgraded deliberately.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
