<div class="dialog-icon" aria-hidden="true"><mat-icon>password</mat-icon></div>
<h2 mat-dialog-title>Temporary Password Generated</h2>
<mat-dialog-content>
  <p class="warning-banner" role="note">
    <mat-icon aria-hidden="true">warning</mat-icon>
    <span><strong>Save this password now!</strong> It is shown only once.</span>
  </p>

  <div class="credential">
    <div class="credential-copy">
      <span class="label">Username</span>
      <code class="value">{{ data.username }}</code>
    </div>
    <button
      matIconButton
      type="button"
      (click)="copyUsername()"
      matTooltip="Copy username"
      aria-label="Copy username"
    >
      <mat-icon>content_copy</mat-icon>
    </button>
  </div>

  <div class="credential">
    <div class="credential-copy">
      <span class="label">Temporary Password</span>
      <code class="value secret">{{ data.temporaryPassword }}</code>
    </div>
    <button
      matIconButton
      type="button"
      (click)="copyPassword()"
      matTooltip="Copy password"
      aria-label="Copy password"
    >
      <mat-icon>content_copy</mat-icon>
    </button>
  </div>

  <button matButton type="button" class="copy-both" (click)="copyAll()">
    <mat-icon>copy_all</mat-icon>
    Copy Both
  </button>

  <p class="hint">The user is asked to change the password at the first sign-in.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton="filled" (click)="close()">Close</button>
</mat-dialog-actions>
