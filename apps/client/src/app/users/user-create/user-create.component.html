<div fxLayout="column" fxFlex fxLayoutGap="24px">
  <app-role-lock-notice subject="user" [roles]="unmanageableRoles" />
  <div fxLayout="row" fxLayoutAlign="space-between center">
    <h2>{{ loaded ? 'Edit user' : 'Create user' }}</h2>
    <button
      matIconButton
      [routerLink]="['../']"
      matTooltip="Back to Users List"
      aria-label="Back to Users List"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
  </div>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <mat-card>
      <mat-card-content fxLayout="column" fxLayoutGap="16px">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" placeholder="Enter unique username" required />
        </mat-form-field>

        <mat-checkbox formControlName="enabled">User enabled</mat-checkbox>

        <mat-form-field subscriptSizing="dynamic">
          <mat-label>Roles</mat-label>
          <mat-select formControlName="roles" multiple>
            @for (option of roleOptions; track option.role) {
              <mat-option [value]="option.role" [disabled]="option.locked">
                {{ option.role }}
              </mat-option>
            }
          </mat-select>
          <mat-hint>
            {{ grantHint }}
            <a href="https://docs.eudiplo.dev/reference/roles" target="_blank" rel="noopener"
              >Learn about roles</a
            >
          </mat-hint>
        </mat-form-field>
      </mat-card-content>

      <mat-card-actions fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="8px">
        <button mat-button type="button" (click)="onCancel()" [disabled]="isSubmitting">
          Cancel
        </button>
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="userForm.invalid || isSubmitting || unmanageableRoles.length > 0"
        >
          @if (loaded) {
            {{ isSubmitting ? 'Updating...' : 'Update User' }}
          } @else {
            {{ isSubmitting ? 'Creating...' : 'Create User' }}
          }
        </button>
      </mat-card-actions>
    </mat-card>
  </form>
</div>
