<div fxLayout="row" fxLayoutAlign="space-between center">
  <h2>Users</h2>
  @if (!isUnavailable) {
    <button
      matIconButton
      [routerLink]="['create']"
      matTooltip="Create New User"
      aria-label="Create New User"
    >
      <mat-icon>person_add</mat-icon>
    </button>
  }
</div>

@if (!loading) {
  @if (isUnavailable) {
    <app-unavailable-card heading="User management is unavailable" [message]="unavailableMessage" />
  } @else if (loadError) {
    <app-load-error [message]="loadError" (retry)="loadUsers()" />
  } @else {
    <table mat-table [dataSource]="users" class="mat-elevation-z8">
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Username</th>
        <td mat-cell *matCellDef="let user">{{ user.username }}</td>
      </ng-container>

      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef>Roles</th>
        <td mat-cell *matCellDef="let user">
          <mat-chip-set>
            @for (role of user.roles; track role) {
              <span>
                <mat-chip>{{ role }}</mat-chip>
              </span>
            }
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="enabled">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let user">{{ user.enabled ? 'Enabled' : 'Disabled' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          @let manageable = canManage(user);
          <button
            matIconButton
            [routerLink]="[user.id]"
            matTooltip="View User Details"
            [attr.aria-label]="'View user ' + user.username"
          >
            <mat-icon>visibility</mat-icon>
          </button>
          <span [matTooltip]="manageDeniedHint" [matTooltipDisabled]="manageable">
            <button
              matIconButton
              [routerLink]="[user.id, 'edit']"
              [disabled]="!manageable"
              matTooltip="Edit User"
              [attr.aria-label]="manageable ? 'Edit User' : 'Edit User: ' + manageDeniedHint"
            >
              <mat-icon>edit</mat-icon>
            </button>
          </span>
          <span [matTooltip]="manageDeniedHint" [matTooltipDisabled]="manageable">
            <button
              matIconButton
              (click)="deleteUser(user)"
              [disabled]="!manageable"
              matTooltip="Delete User"
              [attr.aria-label]="manageable ? 'Delete User' : 'Delete User: ' + manageDeniedHint"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
}
