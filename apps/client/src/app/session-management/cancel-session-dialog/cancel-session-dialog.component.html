<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <p>{{ explanation }}</p>
  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Reason (optional)</mat-label>
    <textarea
      matInput
      [formControl]="reason"
      maxlength="500"
      placeholder="e.g. sent to wrong recipient"
    ></textarea>
    <mat-hint>Stored in the audit log and sent to the session webhook.</mat-hint>
    <mat-hint align="end">{{ reason.value.length }}/500</mat-hint>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Back</button>
  <button mat-raised-button color="warn" type="button" (click)="confirm()">
    {{ confirmLabel }}
  </button>
</mat-dialog-actions>
