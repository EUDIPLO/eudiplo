<div class="dialog-icon" aria-hidden="true"><mat-icon>key</mat-icon></div>
<h2 mat-dialog-title>Client Secret Generated</h2>
<mat-dialog-content>
  <p class="warning-banner" role="note">
    <mat-icon aria-hidden="true">warning</mat-icon>
    <span><strong>Save this secret now!</strong> You won't be able to see it again.</span>
  </p>

  <div class="credential">
    <div class="credential-copy">
      <span class="label">Client ID</span>
      <code class="value">{{ data.clientId }}</code>
    </div>
    <button
      matIconButton
      type="button"
      (click)="copyClientId()"
      matTooltip="Copy client ID"
      aria-label="Copy client ID"
    >
      <mat-icon>content_copy</mat-icon>
    </button>
  </div>

  <div class="credential">
    <div class="credential-copy">
      <span class="label">Client Secret</span>
      <code class="value secret">{{ data.secret }}</code>
    </div>
    <button
      matIconButton
      type="button"
      (click)="copySecret()"
      matTooltip="Copy secret"
      aria-label="Copy Secret"
    >
      <mat-icon>content_copy</mat-icon>
    </button>
  </div>

  <button matButton type="button" class="copy-both" (click)="copyAll()">
    <mat-icon>copy_all</mat-icon>
    Copy Both
  </button>

  <p class="hint">
    If you lose this secret, you can always generate a new one using the "Rotate Secret" button in
    the client list.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton (click)="close()">Close</button>
  <button matButton="filled" (click)="loginAsClient()">
    <mat-icon>login</mat-icon>
    Login as this Client
  </button>
</mat-dialog-actions>
