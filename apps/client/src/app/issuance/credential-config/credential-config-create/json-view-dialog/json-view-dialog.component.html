<div mat-dialog-title class="dialog-title">
  <h2>{{ data.title }}</h2>
  <button matIconButton (click)="copyJson()" matTooltip="Copy JSON" aria-label="Copy JSON">
    <mat-icon>content_copy</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <div class="tab-content">
    <app-editor
      #jsonEditor
      [formControl]="jsonControl"
      [schema]="data.schema"
      [errors]="jsonControl.errors"
    ></app-editor>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button mat-button (click)="cancel()" [disabled]="saving">Cancel</button>
  @if (!data.readonly) {
    <button
      mat-flat-button
      (click)="save()"
      [disabled]="saving"
      [attr.aria-busy]="saving"
      disabledInteractive
      [matTooltip]="saving ? 'Wait until the changes have been saved' : ''"
    >
      <mat-icon>save</mat-icon>
      Apply Changes
    </button>
  }
</mat-dialog-actions>
