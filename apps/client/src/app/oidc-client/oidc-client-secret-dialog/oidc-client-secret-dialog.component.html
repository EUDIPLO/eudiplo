<h2 mat-dialog-title>
  <mat-icon aria-hidden="true">key</mat-icon>
  Client secret
</h2>
<mat-dialog-content>
  <p>
    <strong>Copy the secret now.</strong> It is shown only once; EUDIPLO stores a hash and cannot
    show it again.
  </p>

  <dl>
    <div class="secret-box">
      <dt>Issuer</dt>
      <dd>
        <div class="value">{{ data.issuer }}</div>
        <button mat-stroked-button type="button" (click)="copy(data.issuer, 'Issuer')">
          <mat-icon>content_copy</mat-icon>
          Copy issuer
        </button>
      </dd>
    </div>
    <div class="secret-box">
      <dt>Client ID</dt>
      <dd>
        <div class="value">{{ data.clientId }}</div>
        <button mat-stroked-button type="button" (click)="copy(data.clientId, 'Client ID')">
          <mat-icon>content_copy</mat-icon>
          Copy client ID
        </button>
      </dd>
    </div>
    <div class="secret-box">
      <dt>Client secret</dt>
      <dd>
        <div class="value">{{ data.clientSecret }}</div>
        <button
          mat-stroked-button
          type="button"
          cdkFocusInitial
          (click)="copy(data.clientSecret, 'Client secret')"
        >
          <mat-icon>content_copy</mat-icon>
          Copy client secret
        </button>
      </dd>
    </div>
  </dl>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button mat-dialog-close>I have copied the secret</button>
</mat-dialog-actions>
