<div class="dialog-icon" aria-hidden="true"><mat-icon>key</mat-icon></div>
<h2 mat-dialog-title>New OIDC Client Secret</h2>
<mat-dialog-content>
  <p class="warning-banner" role="note">
    <mat-icon aria-hidden="true">warning</mat-icon>
    <span
      ><strong>Copy the secret now.</strong> It is shown only once; EUDIPLO stores a hash and cannot
      show it again.</span
    >
  </p>

  <div class="credential">
    <div class="credential-copy">
      <span class="label">Issuer</span>
      <code class="value">{{ data.issuer }}</code>
    </div>
    <button
      matIconButton
      type="button"
      (click)="copy(data.issuer, 'Issuer')"
      matTooltip="Copy issuer"
      aria-label="Copy issuer"
    >
      <mat-icon>content_copy</mat-icon>
    </button>
  </div>

  <div class="credential">
    <div class="credential-copy">
      <span class="label">Client ID</span>
      <code class="value">{{ data.clientId }}</code>
    </div>
    <button
      matIconButton
      type="button"
      (click)="copy(data.clientId, 'Client ID')"
      matTooltip="Copy client ID"
      aria-label="Copy client ID"
    >
      <mat-icon>content_copy</mat-icon>
    </button>
  </div>

  <div class="credential">
    <div class="credential-copy">
      <span class="label">Client secret</span>
      <code class="value secret">{{ data.clientSecret }}</code>
    </div>
    <button
      matIconButton
      type="button"
      cdkFocusInitial
      (click)="copy(data.clientSecret, 'Client secret')"
      matTooltip="Copy client secret"
      aria-label="Copy client secret"
    >
      <mat-icon>content_copy</mat-icon>
    </button>
  </div>

  <p class="hint">Enter all three in the OpenID Connect settings of your application.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton="filled" mat-dialog-close>I have copied the secret</button>
</mat-dialog-actions>
