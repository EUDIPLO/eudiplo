# Security headers for every response of the client.
#
# nginx only inherits add_header directives into a block that declares none of
# its own, so every location that sets a header (e.g. Cache-Control) must
# include this file again, or it serves its responses without these headers.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
# Only the origin goes to other sites, never a page address with an authorization code.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 'unsafe-eval' is needed because Ajv compiles JSON Schema validators with
# new Function() at runtime (JSON editor and schema form validation).
add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;
