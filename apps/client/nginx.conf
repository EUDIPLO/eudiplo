pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers. A location with its own add_header does not
        # inherit these, so each such location includes the file again.
        include /etc/nginx/snippets/security-headers.conf;

        # Cache content-hashed files forever: Angular's build output
        # (main-7XK3N2QF.js, media/*) and Monaco's chunks (editor-BdtEMBbM.js)
        # get a new name whenever their content changes.
        location ~* "-[a-z0-9_-]{8}\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$" {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }

        # Static files with stable names (Monaco's loader.js and
        # editor.main.js, public/ images) must be revalidated: a cached copy
        # from an older release points at chunks the new image no longer has.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "no-cache";
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }

        # Specific no-cache rule for env.js. Exact match, because a prefix
        # location loses to the regex locations above.
        location = /env.js {
            # Force no caching with very aggressive headers
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            include /etc/nginx/snippets/security-headers.conf;

            # Force revalidation
            etag off;
            if_modified_since off;
            add_header Last-Modified "" always;

            try_files $uri =404;
        }

        # Handle Angular routing - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;

            # Disable caching for index.html
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Health check endpoint
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
